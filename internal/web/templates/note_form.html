{{define "content"}}
<section class="hero">
  <h1>{{if .Editing}}✏️ 编辑笔记{{else}}＋ 新建笔记{{end}}</h1>
  <p class="sub">沉淀你的认知(信念/案例/错误),可关联到事件/实体。</p>
</section>

<section class="card">
  <form method="post" action="{{if .Editing}}/notes/{{.ID}}/edit{{else}}/notes/new{{end}}" class="cfg-form">
    <label>类型
      <select name="type">
        {{range .TypeChoices}}<option value="{{.Key}}" {{if eq $.Type .Key}}selected{{end}}>{{.Label}}</option>{{end}}
      </select>
    </label>
    <label>标题
      <input type="text" name="title" value="{{.Title}}" required>
    </label>
    <label>slug(稳定键)<span class="hint-inline">留空自动由标题生成</span>
      <input type="text" name="slug" value="{{.Slug}}" placeholder="如 低价股并不代表便宜">
    </label>
    <label>状态
      <select name="status">
        {{range .StatusOptions}}<option value="{{.}}" {{if eq $.Status .}}selected{{end}}>{{zh .}}</option>{{end}}
      </select>
    </label>
    <label>置信度<span class="hint-inline">0~1,可选</span>
      <input type="number" name="confidence" value="{{.Confidence}}" min="0" max="1" step="0.05" placeholder="如 0.8">
    </label>
    <label>内容
      <textarea name="content" rows="8" required placeholder="写下你的想法、判断依据、复盘……">{{.Content}}</textarea>
    </label>

    <div class="cfg-sec">
      <h3>关联事件</h3>
      <select name="sel_events" multiple size="7">
        {{range .Events}}<option value="{{.ID}}" {{if selIn .ID $.SelEvents}}selected{{end}}>{{.Label}}</option>{{end}}
      </select>
      <p class="footnote">按住 Ctrl/Cmd 多选;未选中的事件不关联。最多展示最近 150 条。</p>
    </div>

    <div class="cfg-sec">
      <h3>关联实体</h3>
      <select name="sel_entities" multiple size="7">
        {{range .Entities}}<option value="{{.ID}}" {{if selIn .ID $.SelEntities}}selected{{end}}>{{.Label}}</option>{{end}}
      </select>
      <p class="footnote">按住 Ctrl/Cmd 多选。</p>
    </div>

    <div class="cfg-actions">
      <button type="submit" class="btn">保存</button>
      {{if .Editing}}<a class="btn" href="/notes/{{.ID}}" style="margin-left:8px">取消</a>{{end}}
    </div>
  </form>
</section>
{{end}}
