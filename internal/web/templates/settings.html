{{define "content"}}
<section class="hero">
  <h1>⚙️ 大模型配置</h1>
  <p class="sub">权威源 = 数据库 app_config 表(代码不再读环境变量)。保存即刻生效,次日管线自动使用。</p>
  {{if .Saved}}<div class="alert ok"><b>✅</b>已保存,新配置即刻生效。</div>{{end}}
</section>

<section class="card">
  <h2><span class="dot"></span>大模型(AI)配置</h2>
  <form method="post" action="/settings" class="cfg-form">
    <label>AI 服务地址
      <input type="url" name="ai_service_base_url" value="{{.Form.BaseURL}}" required placeholder="https://api.deepseek.com">
    </label>
    <label>API Key<span class="hint-inline">留空 = 保持现值({{.Form.KeyMasked}})</span>
      <input type="password" name="ai_api_key" value="" autocomplete="new-password" placeholder="{{.Form.KeyMasked}}">
    </label>
    <label>抽取模型(便宜档)
      <input type="text" name="ai_model_extract" value="{{.Form.ModelExtract}}" required placeholder="deepseek-chat">
    </label>
    <label>推理模型(贵档)
      <input type="text" name="ai_model_reasoning" value="{{.Form.ModelReasoning}}" required placeholder="deepseek-reasoner">
    </label>
    <label>日 token 预算(护栏)<span class="hint-inline">0 = 关闭</span>
      <input type="number" name="ai_daily_token_budget" value="{{.Form.Budget}}" min="0" step="1000">
    </label>
    <div class="cfg-actions">
      <button type="submit" class="btn">保存配置</button>
    </div>
  </form>
  <p class="footnote">档位分层(iter0 D2):抽取档 = 便宜模型(快讯归类/实体分类);推理档 = 贵模型(聚类判断/综述)。密钥只存数据库,页面仅掩码展示,不回填明文。</p>
</section>
{{end}}
