name: short-term
version: "1.0.0"
description: 短期关注（express 模式）

mode: express

period:
  display:
    price: 20d
    volume: 20d
    turnover: 20d
    news: 7d
    announcement: 7d
    lhb: 30d          # 龙虎榜回看窗口(issue #26);报告「最近 N 天」按此如实陈述
  compute:
    price: 60d
    turnover: 260d

sections:
  - company
  - market
  - volume
  - turnover
  - events
  - announcements
  # 资金面/龙虎榜(issue #26):短线视角本就看异动,龙虎榜是异动的直接证据。
  # 此前该链路从采集到渲染无入口(section 非法/plan 无分支/context 无写入点),
  # 致短线 profile 对「资金」维度全盲。
  - capital
  - conclusion

# 评分卡维度：express 档案无财务/估值/风险章节，只保留可确定性计算的量价与事件维度。
# 未纳入的维度不参与打分、不显示 N/A，也不触发「结论受限」（那是「数据缺失」的语义）。
scorecard:
  dimensions:
    - market_trend
    - recent_events
  overall_rule: simple_sum   # 方向按平均维度分判定（见 scorecard.py）
  scale: [-2, -1, 0, +1, +2]

