# PIKS 生产 compose(lab 实例化到 /home/rguo/piks/docker-compose.yml,setup.sh 复制)。
# 与 dev 的 configs/docker-compose.yml 区别:tools 服务、私有网络 piks、5433 只绑回环、容器内用户对齐宿主 rguo(uid 1000)。
# postgres:  `docker compose up -d`(仅此常驻)。
# web:       迭代5 Web 平台常驻(:8090 对外只读,5-3 将加编辑/AI)。
# tools:    `docker compose run --rm tools ./bin/<cmd>`(profile=run,不随 up 常驻)。
services:
  postgres:
    image: postgres:16-alpine
    container_name: piks-postgres
    environment:
      POSTGRES_USER: piks
      POSTGRES_PASSWORD: ${PIKS_DB_PASSWORD:-piks_dev_password}
      POSTGRES_DB: piks
    ports:
      - "127.0.0.1:5433:5432"          # 只绑回环,不对外暴露
    volumes:
      - piks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piks -d piks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [piks]

  # Web 网关(nginx :80,发布 :8090):React SPA + 反代 /api/*;同容器内含 Go web 与 Python 深研运行时。
  # 单镜像(2026-09-12):Go web 与 nginx、research(Python)同容器 ——
  # Go 只监听 127.0.0.1:8090(不直接暴露局域网),深研编排在 web 进程内 os/exec python3。
  web:
    image: piks-tools:latest
    container_name: piks-web
    ports:
      - "0.0.0.0:8090:80"              # 对外只留 nginx 网关;浏览器访问 http://192.168.0.202:8090
    env_file: [".env"]                 # 仅 DB 变量;AI 配置走 app_config 表(/settings 编辑)
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
      - PIKS_UPLOAD_DIR=/data/uploads  # 迭代 5-3:/chat 截图落盘(piks_data 命名卷)
      - PIKS_RESEARCH_OUT_DIR=/data/research  # 深研产物持久化:断点重跑可复用(容器内 /tmp 易失)
      # AI 网关自签 CA:Go(crypto/x509)读 SSL_CERT_DIR,语义为「并集」——
      # /etc/ssl/certs(公共根,debian ca-certificates)+ 网关 CA 目录,既信任自签网关又保留公共根。
      # (dev 侧 ~/.zshrc 因曾受 SSL_CERT_FILE 替换语义所苦而手动合并 bundle;此处无需合并。)
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
    volumes:
      - piks_data:/data
      - ./certs:/certs:ro              # 网关自签 CA(仅 lab,不进 git)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [piks]
    command: ["sh", "-c", "./bin/web -listen 127.0.0.1:8090 & sleep 1; exec nginx -g 'daemon off;'"]

  # 深研 CLI 入口已并入 web 容器(Python 运行时在 piks-tools 内):
  #   `docker compose exec web ./bin/research-run 000560 --profile short-term`
  # (原 piks-research 独立镜像/服务已随单镜像化移除。)

  tools:
    image: piks-tools:latest
    profiles: ["run"]                  # 仅 compose run --rm 用,不随 up 常驻
    user: "1000:1000"                  # 对齐宿主 rguo,挂载目录写出的文件归 rguo
    env_file: [".env"]                 # /home/rguo/piks/.env(真实密钥,0600)
    environment:
      - TZ=Asia/Shanghai               # 非交易日判定/复盘日期均为北京时间
      # AI 网关自签 CA(与 web 同):pipeline 各命令调 LLM 亦需信任(worker/entity-build/…)
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
      # 迭代 5-2:vault/GitHub 下线,不再挂载 vault 卷(Web 直读 PG)。
    volumes:
      - ./certs:/certs:ro              # 网关自签 CA(仅 lab,不进 git)
    networks: [piks]
    command: ["sh", "-c", "true"]

networks:
  piks:

volumes:
  piks_pgdata:
  piks_data:                              # /chat 截图上传(迭代 5-3)
