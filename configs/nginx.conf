# PIKS 网关(生产容器内 nginx):纯 React SPA + 反代 Go(/api/*)。
# Go web 与 nginx 同容器,Go 只监听 127.0.0.1:8090,浏览器仅见 nginx(:80,发布为 :8090)。
# 全部页面由 SPA 提供(React Router 客户端路由);/api/* 反代 Go(JSON + 截图上传)。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 截图上传(body 默认 1m 不够)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API(JSON + /api/attachments/ 截图)→ Go
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA:静态资源直接命中,否则回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
