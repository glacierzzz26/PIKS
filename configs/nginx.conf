# PIKS 网关(生产容器内 nginx,独立 gateway 容器):纯 React SPA + 反代 Go(/api/*)。
# 全部页面由 SPA 提供(React Router 客户端路由);/api/* 反代 web 容器(JSON + 截图上传)。
#
# ⚠️ **resolver + 变量式 proxy_pass 是必须的,不是优化**(2026-09-20 容器拆分):
# nginx 对 proxy_pass 里的**字面主机名**只在 worker 启动时解析一次,之后把 IP 缓存到进程
# 结束。Docker 每次重建 web 容器都会给它新 IP —— 于是 deploy.sh 每跑一次 `up -d web`,
# gateway 就会一直 502 直到自己被重启。改用 Docker 内嵌 DNS(127.0.0.11)+ 变量式
# proxy_pass,nginx 才会按 valid= 重新解析。
#
# ⚠️ 变量式 proxy_pass **不会自动带上原 URI**:必须显式拼 $request_uri,否则 /api/v1/x
# 会被请求成 /。这是变量式 proxy_pass 的经典陷阱。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 截图上传(body 默认 1m 不够)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API(JSON + /api/attachments/ 截图)→ web 容器
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 内嵌 DNS;每次 web 重建后重解析
        set $piks_web "http://web:8090";
        proxy_pass $piks_web$request_uri;          # 变量式:必须拼 $request_uri(见头注)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA:静态资源直接命中,否则回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
