# PIKS 生产 compose(lab 实例化到 /home/rguo/piks/docker-compose.yml,setup.sh 复制)。
# 与 dev 的 configs/docker-compose.yml 区别:tools 服务、私有网络 piks、5433 只绑回环、容器内用户对齐宿主 rguo(uid 1000)。
# postgres:  `docker compose up -d`(仅此常驻)。
# web:       迭代5 Web 平台常驻(:8090 对外只读,5-3 将加编辑/AI)。
# tools:    `docker compose run --rm tools ./bin/<cmd>`(profile=run,不随 up 常驻)。
services:
  postgres:
    image: postgres:16-alpine
    container_name: piks-postgres
    environment:
      POSTGRES_USER: piks
      POSTGRES_PASSWORD: ${PIKS_DB_PASSWORD:-piks_dev_password}
      POSTGRES_DB: piks
    ports:
      - "127.0.0.1:5433:5432"          # 只绑回环,不对外暴露
    volumes:
      - piks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piks -d piks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [piks]

  # 迭代5 Web 平台:PostgreSQL 直接渲染 HTML(只读)。图谱/点选面板走 /api JSON。
  # 不依赖 Markdown/vault;仅经 postgres 读数据,故不需 tools 的 vault 挂载。
  web:
    image: piks-tools:latest
    container_name: piks-web
    ports:
      - "0.0.0.0:8090:8090"            # 对 lab 局域网暴露,浏览器访问 http://192.168.0.202:8090
    env_file: [".env"]                 # 仅 DB 变量;AI 配置走 app_config 表(/settings 编辑)
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [piks]
    command: ["./bin/web"]

  tools:
    image: piks-tools:latest
    profiles: ["run"]                  # 仅 compose run --rm 用,不随 up 常驻
    user: "1000:1000"                  # 对齐宿主 rguo,挂载目录写出的文件归 rguo
    env_file: [".env"]                 # /home/rguo/piks/.env(真实密钥,0600)
    environment:
      - TZ=Asia/Shanghai               # 非交易日判定/复盘日期均为北京时间
      # 迭代 5-2:vault/GitHub 下线,不再挂载 vault 卷(Web 直读 PG)。
    networks: [piks]
    command: ["sh", "-c", "true"]

networks:
  piks:

volumes:
  piks_pgdata:
