services:
  # PIKS 独立 Postgres 实例(D7: 与 steady 隔离;宿主端口 5433 避免冲突)
  postgres:
    image: postgres:16-alpine
    container_name: piks-postgres
    environment:
      POSTGRES_USER: piks
      POSTGRES_PASSWORD: ${PIKS_DB_PASSWORD:-piks_dev_password}
      POSTGRES_DB: piks
    ports:
      - "5433:5432"
    volumes:
      - piks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piks -d piks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  piks_pgdata:
