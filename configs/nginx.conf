# PIKS 网关(生产容器内 nginx):React SPA 只读页 + 反代 Go(/api/* 与交互页)。
# Go web 与 nginx 同容器,Go 只监听 127.0.0.1:8090,浏览器仅见 nginx(:80,发布为 :8090)。
# 路径分流与 frontend/vite.config.ts 的 dev proxy 保持一致:
#   - /api/*            → Go(JSON + 截图上传)
#   - 交互页/详情页      → Go HTML(笔记编辑/设置/对话/交易/周报/事件·实体·复盘详情)
#   - 其余(SAP 只读页)   → 静态文件,未命中回退 index.html(React Router 客户端路由)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /chat 截图上传(body 默认 1m 不够)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API(JSON + /api/attachments/ 截图)→ Go
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Go 页面静态资源(base.css 等,内嵌于 Go binary)
    location /static/ {
        proxy_pass http://127.0.0.1:8090;
    }

    # 交互页(Go HTML 编辑/管理):笔记/设置/对话/交易/周报
    location ~ ^/(notes|settings|chat|trades|weekly)(/|$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 详情页(Go HTML):/events/{id} /entities/{id} /reviews/{id}(列表本身由 SPA 服务)
    location ~ ^/(events|entities|reviews)/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA:静态资源直接命中,否则回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
