{{define "base"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📈</text></svg>">
<link rel="stylesheet" href="/static/base.css">
</head>
<body data-page="{{.Active}}">
<header class="topbar">
  <div class="topbar-inner wrap">
    <a class="brand" href="/"><span class="brand-logo">PIKS</span><span class="brand-sub">投资知识系统</span></a>
    <nav class="nav">
      <a href="/" class="{{if eq .Active "dashboard"}}active{{end}}">看板</a>
      <a href="/graph" class="{{if eq .Active "graph"}}active{{end}}">关系图谱</a>
      <a href="/events" class="{{if eq .Active "events"}}active{{end}}">事件流</a>
      <a href="/reviews" class="{{if eq .Active "reviews"}}active{{end}}">复盘</a>
      <a href="/notes" class="{{if eq .Active "notes"}}active{{end}}">笔记</a>
      <a href="/weekly" class="{{if eq .Active "weekly"}}active{{end}}">周报</a>
      <a href="/chat" class="{{if eq .Active "chat"}}active{{end}}">AI 对话</a>
      <a href="/recon" class="{{if eq .Active "recon"}}active{{end}}">对账</a>
      <a href="/settings" class="{{if eq .Active "settings"}}active{{end}}">配置</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" title="切换深浅色" aria-label="切换深浅色">🌙</button>
  </div>
</header>

<main class="wrap">
  {{if .Err}}<div class="alert err"><b>出错了</b> {{.Err}}</div>{{end}}
  {{template "content" .}}
</main>

<footer class="foot wrap">
  <span>数据源:PostgreSQL(真相源直接渲染,零 Markdown 投影)</span>
  <span>迭代 5 · Web 平台</span>
</footer>

<script src="/static/base.js"></script>
{{if .Scripts}}<script src="/static/{{.Scripts}}"></script>{{end}}
</body>
</html>
{{end}}
