# PIKS 生产 compose(lab 实例化到 /home/rguo/piks/docker-compose.yml,setup.sh 复制)。
#
# ── 四镜像(2026-09-20 容器拆分,issue #47)────────────────────────────────
# 取代 2026-09-12 的**单镜像**(piks-tools 曾同时背 nginx + Go web + Python 深研)。
# 现在各管一摊,升级半径分开:改前端只重建 gateway,改 Python 只重建 research。
#   gateway  纯 nginx,**唯一对外**(发布 8090),反代 /api/* → web
#   web      纯 Go JSON API,私网内监听,不发布宿主端口
#   research 常驻队列 worker + Python 深研运行时(认领 research_runs 的 pending 行)
#   tools    profile=run,跑一次即退(管线命令 + migrate)
#   postgres 唯一 Source of Truth
#
# ⚠️ 深研不再在 web 进程内跑:web 容器已无 python3,UI 触发 → 建 pending 行 →
# research 的 worker 认领执行(见 migrations/0015、cmd/research-worker)。
# ─────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: piks-postgres
    environment:
      POSTGRES_USER: piks
      POSTGRES_PASSWORD: ${PIKS_DB_PASSWORD:-piks_dev_password}
      POSTGRES_DB: piks
    ports:
      - "127.0.0.1:5433:5432"          # 只绑回环,不对外暴露
    volumes:
      - piks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piks -d piks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [piks]

  # 网关:唯一对外入口(:8090 → 容器 80)。只服务 SPA 静态文件 + 反代 /api/*。
  # depends_on web 用 service_healthy:让 gateway 启动时 web 的 DNS 已可解析。
  # ⚠️ 即便如此,nginx 仍必须用 resolver(见 nginx.conf 头注)—— 否则 web 每次重建
  # (deploy.sh 会做)都会让 gateway 502 到它自己被重启。
  gateway:
    image: piks-gateway:latest
    container_name: piks-gateway
    ports:
      - "0.0.0.0:8090:80"              # 对外只此一处;浏览器访问 http://192.168.0.202:8090
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [piks]

  # Go JSON API。**不发布宿主端口** —— 私网内可路由即可,故未对局域网暴露。
  web:
    image: piks-web:latest
    container_name: piks-web
    env_file: [".env"]                 # 仅 DB 变量;AI 配置走 app_config 表(/settings 编辑)
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
      - PIKS_UPLOAD_DIR=/data/uploads  # /chat 截图落盘(piks_data 命名卷)
      # AI 网关自签 CA:Go(crypto/x509)读 SSL_CERT_DIR,语义为「并集」——
      # /etc/ssl/certs(公共根,alpine ca-certificates)+ 网关 CA 目录,既信任自签网关又保留公共根。
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
    volumes:
      - piks_data:/data
      - ./certs:/certs:ro              # 网关自签 CA(仅 lab,不进 git)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # ⚠️ 必须打**免鉴权**的 /api/v1/healthz(P12 / issue #78):`/api/v1/dashboard` 上了
      # 鉴权后返回 401 → 本探针恒失败 → web 永远 not healthy → gateway 的
      # depends_on(service_healthy) 永不满足 → **gateway 起不来,部署挂死**(设计 §4.4)。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [piks]

  # 深研常驻 worker + Python 运行时。认领 research_runs 的 pending 行并驱动编排。
  # ⚠️ stop_grace_period 必须 > research.TimeoutTotal(6min):docker 默认只给 10s,
  # 会在 run 跑到一半时 SIGKILL,把它留成孤儿(靠 reaper 兜,但是无谓的损失)。
  research:
    image: piks-research:latest
    container_name: piks-research
    env_file: [".env"]
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
      - PIKS_RESEARCH_DIR=/app/research
      - PIKS_PYTHON_BIN=python3
      - PIKS_RESEARCH_OUT_DIR=/data/research  # 产物持久化:断点重跑可复用(容器内 /tmp 易失)
      # 深研合成走 LLM(HTTPS),同 web 需要自签网关 CA。
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
    volumes:
      # 与 web 共享 piks_data,但子目录不重叠(web=/data/uploads,research=/data/research),
      # 故零数据搬迁;拆成两个卷会遗弃 lab 上已有的深研产物。
      - piks_data:/data
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 7m             # > TimeoutTotal:drain 在跑的 run,不 SIGKILL
    networks: [piks]

  # 管线命令入口:`docker compose run --rm tools ./bin/<cmd>`(profile=run,不随 up 常驻)
  tools:
    image: piks-tools:latest
    profiles: ["run"]                  # 仅 compose run --rm 用,不随 up 常驻
    user: "1000:1000"                  # 对齐宿主 rguo,挂载目录写出的文件归 rguo
    env_file: [".env"]                 # /home/rguo/piks/.env(真实密钥,0600)
    environment:
      - TZ=Asia/Shanghai               # 非交易日判定/复盘日期均为北京时间
      # AI 网关自签 CA(与 web 同):pipeline 各命令调 LLM 亦需信任(worker/entity-build/…)
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
      # 迭代 5-2:vault/GitHub 下线,不再挂载 vault 卷(Web 直读 PG)。
    volumes:
      - ./certs:/certs:ro              # 网关自签 CA(仅 lab,不进 git)
    networks: [piks]
    command: ["sh", "-c", "true"]

  # 盘中快讯采集常驻进程(issue #68 C 层)。**复用 piks-tools 镜像**(故仍是四镜像),
  # 与 tools 的唯一差别是 command:常驻循环 -interval 3m 而非跑一轮即退。
  #
  # ⚠️ 为什么常驻而非「cron 每 3 分钟拉起一次」:反封禁护栏里的**空响应哨兵与熔断**靠
  #   **跨轮累积**状态(连续 N 次空/连败才触发);一次性进程每轮从零开始,两条护栏形同虚设。
  #   常驻进程把状态留在内存,护栏才真正生效。日管线的 `collector -driver all`(16:10 后
  #   补一轮)保持不变 —— 二者幂等 + 迁移 0016 去重,重复无害。
  # ⚠️ 只跑快讯源(-driver news,6 家):公告(巨潮)单日 ~1200 条/40 页翻页重,
  #   留日管线采一次,不进盘中高频循环。
  collector:
    image: piks-tools:latest
    container_name: piks-collector
    env_file: [".env"]
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./bin/collector", "-driver", "news", "-interval", "3m"]
    networks: [piks]

  # 热榜采集常驻进程(issue #68 D 层)。**复用 piks-tools 镜像**(故仍是四镜像),
  # 与 collector 同形,只是频率与去向不同。
  #
  # ⚠️ 独立表 + 独立进程,**刻意不进 collector 进程**:热榜与快讯的采集策略/去向/频率
  #   全不同(热榜不进 raw_documents、不进聚类 —— 设计 §6 红线,热榜可被操纵)。
  #   合成一个进程会让「把热榜塞进事件链路」在实现上变得太容易。
  # ⚠️ 盘中每 30 分钟(用户 2026-09-22 定):热榜分钟级变化小,30 分钟足够看出走势;
  #   每次仅 ~28 条 → 盘中约 11 次/日 ≈ 300 行。同样**必须常驻**(护栏状态靠跨轮累积)。
  hot-topic:
    image: piks-tools:latest
    container_name: piks-hot-topic
    env_file: [".env"]
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./bin/hot-topic", "-interval", "30m"]
    networks: [piks]

  # 同花顺「我的自选」自动同步常驻进程(issue #87)。**复用 piks-tools 镜像**(故仍是四镜像)。
  #
  # ⚠️ 与 hot-topic 的关键差异:hot-topic 每轮都采;watch-sync 是**每日定点**
  #   (09:00/12:55/18:00 北京时间,北京时间=Asia/Shanghai 下方 TZ 已设),靠 task_runs
  #   去重(meta.slot,**只有 success 才算已跑**)—— 容器重启不会把一天 3 次变成 5 次
  #   (多余登录 = 同花顺风控风险)。
  # ⚠️ 依赖迁移 0020 的 watchlist_entries 表,故 deploy.sh 把它排在 `migrate` 之后。
  # ⚠️ 凭据(ths_cookie/ths_account/ths_password)不在此处,存 app_config 表,
  #   /settings 页写入(见 docs/phase11/design/watchlist-sync.md §凭据)。
  watch-sync:
    image: piks-tools:latest
    container_name: piks-watch-sync
    env_file: [".env"]
    environment:
      - TZ=Asia/Shanghai
      - PIKS_DATABASE_URL=postgres://piks:${PIKS_DB_PASSWORD:-piks_dev_password}@postgres:5432/piks?sslmode=disable
      - SSL_CERT_DIR=/etc/ssl/certs:/certs
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./bin/watch-sync", "-interval", "1m", "-slots", "09:00,12:55,18:00"]
    networks: [piks]

networks:
  piks:

volumes:
  piks_pgdata:
  piks_data:                              # /chat 截图上传 + 深研产物
